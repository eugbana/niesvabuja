<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000028;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#49739c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#gradient)" rx="64"/>
  
  <!-- NIESV Logo/Icon -->
  <g transform="translate(128, 128)">
    <!-- Building/Property Icon -->
    <rect x="0" y="160" width="256" height="96" fill="#f8fafc" rx="8"/>
    <rect x="32" y="128" width="192" height="128" fill="#e7edf4" rx="8"/>
    <rect x="64" y="96" width="128" height="160" fill="#ffffff" rx="8"/>
    
    <!-- Windows -->
    <rect x="80" y="120" width="24" height="24" fill="#000028" rx="2"/>
    <rect x="120" y="120" width="24" height="24" fill="#000028" rx="2"/>
    <rect x="160" y="120" width="24" height="24" fill="#000028" rx="2"/>
    
    <rect x="80" y="160" width="24" height="24" fill="#000028" rx="2"/>
    <rect x="120" y="160" width="24" height="24" fill="#000028" rx="2"/>
    <rect x="160" y="160" width="24" height="24" fill="#000028" rx="2"/>
    
    <rect x="80" y="200" width="24" height="24" fill="#000028" rx="2"/>
    <rect x="120" y="200" width="24" height="24" fill="#000028" rx="2"/>
    <rect x="160" y="200" width="24" height="24" fill="#000028" rx="2"/>
    
    <!-- Door -->
    <rect x="120" y="220" width="24" height="36" fill="#d4af37" rx="2"/>
    <circle cx="138" cy="238" r="2" fill="#000028"/>
  </g>
  
  <!-- NIESV Text -->
  <text x="256" y="400" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#ffffff">NIESV</text>
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#e7edf4">Estate Surveyors</text>
</svg>
